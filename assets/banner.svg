<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ESP 32 LED Controller, by Asif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080f"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <ellipse cx="300" cy="120" rx="430" ry="190" fill="url(#halo)"/>
  <ellipse cx="1100" cy="250" rx="420" ry="200" fill="url(#halo2)"/>

  <rect x="80" y="78" width="72" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="80" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="1">ESP 32 LED CONTROLLER</text>

  <text x="82" y="184" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="20" fill="#94a3b8">Performance &#183; Music &#183; Screen &#183; Custom &#8212; real-time lighting for WLED</text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12"
     font-weight="600" text-anchor="middle">
    <g transform="translate(80,210)">
      <rect width="128" height="28" rx="14" fill="#22d3ee" fill-opacity="0.10"
            stroke="#22d3ee" stroke-opacity="0.35"/>
      <text x="64" y="19" fill="#67e8f9">ESP32 + WLED</text>
    </g>
    <g transform="translate(220,210)">
      <rect width="146" height="28" rx="14" fill="#22c55e" fill-opacity="0.10"
            stroke="#22c55e" stroke-opacity="0.35"/>
      <text x="73" y="19" fill="#86efac">DDP &#183; 30&#8211;60 FPS</text>
    </g>
    <g transform="translate(378,210)">
      <rect width="118" height="28" rx="14" fill="#a855f7" fill-opacity="0.10"
            stroke="#a855f7" stroke-opacity="0.35"/>
      <text x="59" y="19" fill="#d8b4fe">100% LOCAL</text>
    </g>
  </g>

  <!-- LED strip -->
  <g transform="translate(80,258)">
    <rect x="-14" y="0" width="648" height="34" rx="17" fill="#0f172a"
          stroke="#1e293b" stroke-width="1"/>
    <g>
      <circle cx="30" cy="17" r="17" fill="#2563eb" fill-opacity="0.20"/>
      <circle cx="30" cy="17" r="8" fill="#3b82f6"/>
      <circle cx="110" cy="17" r="17" fill="#06b6d4" fill-opacity="0.20"/>
      <circle cx="110" cy="17" r="8" fill="#22d3ee"/>
      <circle cx="190" cy="17" r="17" fill="#22c55e" fill-opacity="0.20"/>
      <circle cx="190" cy="17" r="8" fill="#4ade80"/>
      <circle cx="270" cy="17" r="17" fill="#eab308" fill-opacity="0.20"/>
      <circle cx="270" cy="17" r="8" fill="#facc15"/>
      <circle cx="350" cy="17" r="17" fill="#f97316" fill-opacity="0.20"/>
      <circle cx="350" cy="17" r="8" fill="#fb923c"/>
      <circle cx="430" cy="17" r="17" fill="#ef4444" fill-opacity="0.20"/>
      <circle cx="430" cy="17" r="8" fill="#f87171"/>
      <circle cx="510" cy="17" r="17" fill="#ec4899" fill-opacity="0.20"/>
      <circle cx="510" cy="17" r="8" fill="#f472b6"/>
      <circle cx="590" cy="17" r="17" fill="#a855f7" fill-opacity="0.20"/>
      <circle cx="590" cy="17" r="8" fill="#c084fc"/>
    </g>
  </g>

  <text x="1200" y="288" text-anchor="end"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" fill="#e2e8f0">by Asif</text>
  <text x="1200" y="266" text-anchor="end"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="12" fill="#64748b">v2.0 &#183; Windows</text>
</svg>
